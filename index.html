<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Переход в закрытый чат</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      font-family: Arial, sans-serif;
      background: #f4efe8;
      color: #262626;
    }

    .card {
      width: 100%;
      max-width: 520px;
      padding: 40px 28px;
      text-align: center;
      background: #ffffff;
      border-radius: 20px;
      box-shadow: 0 14px 40px rgba(0, 0, 0, 0.08);
    }

    h1 {
      margin: 0 0 16px;
      font-size: 30px;
      line-height: 1.2;
    }

    p {
      margin: 0;
      font-size: 17px;
      line-height: 1.5;
      color: #666666;
    }

    .loader {
      width: 38px;
      height: 38px;
      margin: 28px auto 0;
      border: 4px solid #e6e6e6;
      border-top-color: #262626;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }
  </style>
</head>

<body>
  <div class="card">
    <h1>Подключаем Вас к закрытому чату</h1>

    <p>Через секунду откроется чат ВКонтакте.</p>

    <div class="loader"></div>
  </div>

  <script>
    const chatUrl =
      "https://vk.me/join/S0ZZXY6i_9hlZDPH_UZ2xYvN5f14rYBjeN0=";

    setTimeout(function () {
      window.location.replace(chatUrl);
    }, 1000);
  </script>
</body>
</html>
